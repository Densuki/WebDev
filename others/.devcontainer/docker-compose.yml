# version: '3.8'

services:
  dev:
    image: mcr.microsoft.com/vscode/devcontainers/python:3.12-bullseye
    container_name: etheriuscraft-network_site
    user: vscode
    tty: true
    volumes:
      - ..:/workspace:cached
    working_dir: /workspace
    command: sleep infinity
    ports:
      - "3000:3000" # React
      - "8000:8000" # Python backend
      - "5432:5432" # PostgreSQL
      - "3306:3306" # MySQL
      - "27017:27017" # MongoDB
    environment:
      - PYTHONUNBUFFERED=1
      - NODE_ENV=development
